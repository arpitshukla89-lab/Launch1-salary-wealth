function calculate(){

let income = Number(document.getElementById("income").value.replace(/,/g,''));
let emi = Number(document.getElementById("emi").value.replace(/,/g,''));
let goal = Number(document.getElementById("goal").value.replace(/,/g,''));

// ✅ NEW INPUT
let expensePercentInput = Math.min(100, Number(document.getElementById("expensePercent").value));

if(!income || !goal || !years){ alert("Fill required fields"); return; }

// ===== HEALTH CALC =====

// ✅ UPDATED
let expensePercent = expensePercentInput || 50;
let expense = income * (expensePercent/100);
let totalExpense = expense + emi;
let suggestedExpense = income * 0.5;

let emergency6 = totalExpense * 6;
let emergency9 = totalExpense * 9;
let emergency12 = totalExpense * 12;

let emiRatio = (emi/income)*100 || 0;

// ✅ UPDATED SCORE
let totalBurden = emiRatio + expensePercent;
let score = 100 - totalBurden;
score = Math.max(0, Math.min(100, score));
score = Math.max(0, Math.min(100, score));

let emiColor = emiRatio <=30 ? "#22c55e" : emiRatio <=40 ? "#eab308" : "#ef4444";
let emiCategory = emiRatio <=30 ? "🟢 Safe" :
                  emiRatio <=40 ? "🟡 Unsafe" : "🔴 Hazardous";

// ✅ CATEGORY
let expenseStatus = expensePercent <=50 ? "🟢 Healthy Spending" :
expensePercent<=70 ? "🟡 Moderate Spending" : "🔴 High Spending";

let expenseColor = expensePercent <=50 ? "#22c55e" :
expensePercent<=70 ? "#eab308" : "#ef4444";
// ✅ AI ADVICE
let advice = "";

if(score < 40){
  advice = "🚨 You are financially stressed. Reduce expenses or EMI immediately.";
}
else if(score < 70){

}

let ctx1 = document.getElementById("emergencyChart").getContext("2d");

// ===== GOAL TAB (UNCHANGED) =====
let inflation = 0.06;
let rate = risk=="high"?0.14:risk=="medium"?0.12:0.08;
let realReturn = ((1+rate)/(1+inflation)-1)*100;

let r = rate/12;

let inflatedGoal = goal*Math.pow(1+inflation,years);

let sipNormal = goal/(((Math.pow(1+r,years*12)-1)/r)*(1+r));
// 🎯 BEST SIP SUGGESTION

let bestSip = sipNormal;


function calculateExactSIP(target, r, months){

    let low = 0;
    let high = target; // max possible
    let mid, fv;

    while(high - low > 1){

        mid = (low + high) / 2;

        fv = mid * ((Math.pow(1+r, months) - 1) / r) * (1+r);

        if(fv < target){
            low = mid;
        }else{
            high = mid;
        }
    }

    return Math.round(high); // ₹1 precision
}

// 🔥 USE THIS

else if(risk === "low"){

        currentSip *= (1 + stepUpRate);

async function getTopFunds(){

// 🔥 CACHE (FAST LOAD)
let cache = localStorage.getItem("topFunds");

if(cache){
  let parsed = JSON.parse(cache);

  if(Date.now() - parsed.time < 12*60*60*1000){
    return parsed.data;
  }
}

// 🔥 FIXED BEST FUNDS (NO RANDOM)
let schemes = [
122639,
120503,
120716,
120828,
120465,
125354,
118834,
119551,
120186,
118989
];

let results = [];

for(let code of schemes){

  try{

    let res = await fetch(`https://api.mfapi.in/mf/${code}`);
    let data = await res.json();

    let nav = data.data;

    if(!nav || nav.length < 200) continue;

    let latest = parseFloat(nav[0].nav);
    let old = parseFloat(nav[Math.min(750, nav.length-1)].nav);

    let cagr = (Math.pow(latest/old,1/3)-1)*100;

    results.push({
      name: data.meta.scheme_name.substring(0,35),
      return: cagr.toFixed(1)
    });

  }catch(e){
    continue;
  }
}

// 🔥 SORT
results.sort((a,b)=>parseFloat(b.return)-parseFloat(a.return));

// 🔥 SAVE CACHE
localStorage.setItem("topFunds", JSON.stringify({
  time: Date.now(),
  data: results
}));

return results;
}

async function renderPortfolio(risk){

risk=="medium"?{e:60,d:30,g:10}:
{e:80,d:15,g:5};
let recommendedType = "";

function showOpt(id,el){

.forEach(e=>e.classList.remove("active"));

.forEach(t=>t.classList.remove("active"));

window.addEventListener("DOMContentLoaded", function () {

  // existing code (already present)
  document.getElementById("expensePercent").addEventListener("input", function () {
    if (this.value > 100) this.value = 100;
    if (this.value < 0) this.value = 0;
  });

  // 🔥 ADD THIS BELOW
  ["income","emi","goal"].forEach(id => {

    let el = document.getElementById(id);

    el.addEventListener("input", function(){

      let val = this.value.replace(/,/g,'');   // remove old commas
      val = val.replace(/[^0-9]/g,'');         // only numbers

      this.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ","); // add commas

    });

  });

});
function closeFundInfo(){
document.getElementById("fundInfoBox").style.bottom = "-100%";

document.getElementById("overlay").style.opacity = "0";
document.getElementById("overlay").style.pointerEvents = "none";
}
document.getElementById("overlay").addEventListener("click", closeFundInfo);
let sheet = document.getElementById("fundInfoBox");

let startY = 0;
let currentY = 0;
let isDragging = false;

sheet.addEventListener("touchstart", (e)=>{
startY = e.touches[0].clientY;
isDragging = true;
});

sheet.addEventListener("touchmove", (e)=>{
if(!isDragging) return;

currentY = e.touches[0].clientY;
let diff = currentY - startY;

if(diff > 0){
sheet.style.transform = `translateY(${diff}px)`;
}
});

sheet.addEventListener("touchend", ()=>{
isDragging = false;

if(currentY - startY > 100){
closeFundInfo();
}else{
sheet.style.transform = "translateY(0)";
}
});
let isMouseDown = false;

sheet.addEventListener("mousedown", (e)=>{
startY = e.clientY;
isMouseDown = true;
});

window.addEventListener("mousemove", (e)=>{
if(!isMouseDown) return;

let diff = e.clientY - startY;
if(diff > 0){
sheet.style.transform = `translateY(${diff}px)`;
}
});

window.addEventListener("mouseup", ()=>{
if(!isMouseDown) return;

isMouseDown = false;

if(currentY - startY > 100){
closeFundInfo();
}else{
sheet.style.transform = "translateY(0)";
}
});
</script>
